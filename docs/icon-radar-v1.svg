<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e6fe0"/>
      <stop offset="0.55" stop-color="#1257b8"/>
      <stop offset="1" stop-color="#0c3d80"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#9fd4ff" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dffd4" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#7dffd4" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7dffd4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd479" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#ffd479" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffd479" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- 雷达同心环 -->
    <circle cx="256" cy="246" r="212" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="12"/>
    <circle cx="256" cy="246" r="212" fill="none" stroke="#bfe0ff" stroke-opacity="0.35" stroke-width="4"/>
    <circle cx="256" cy="246" r="152" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
    <circle cx="256" cy="246" r="92"  fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>

    <!-- 十字准线 -->
    <line x1="30" y1="246" x2="482" y2="246" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
    <line x1="256" y1="20"  x2="256" y2="472" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

    <!-- 扫描扇形 (右上) -->
    <path d="M256,246 L468,246 A212,212 0 0 0 385,86 Z" fill="url(#sweep)"/>

    <!-- 目标光点 -->
    <circle cx="352" cy="128" r="46" fill="url(#glow)"/>
    <circle cx="352" cy="128" r="11" fill="#8fffd8"/>
    <circle cx="150" cy="330" r="34" fill="url(#glow2)"/>
    <circle cx="150" cy="330" r="8" fill="#ffd479"/>

    <!-- 中心基字 -->
    <text x="256" y="246" text-anchor="middle" dominant-baseline="central"
          font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-weight="bold"
          font-size="188" fill="#0a2f63" opacity="0.55" transform="translate(6,8)">基</text>
    <text x="256" y="246" text-anchor="middle" dominant-baseline="central"
          font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-weight="bold"
          font-size="188" fill="#ffffff">基</text>

    <!-- 底部名称 -->
    <text x="256" y="474" text-anchor="middle"
          font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-weight="bold"
          font-size="42" letter-spacing="10" fill="#ffffff" fill-opacity="0.92">基金雷达</text>
  </g>
</svg>
